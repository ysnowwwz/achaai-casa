<!doctype html>
<html lang="pt-BR">
<head>

<meta name="description" content="AchaAI Casa: compara itens de casa pelo preço final na sua porta, com frete, montagem e imposto. Projeto de estudo, preços de demonstração.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AchaAI Casa</title>
<link rel="icon" type="image/svg+xml" href="assets/marca/favicon.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* AchaAI Casa: a Corrida do Preço levada para dentro de casa.
   Layout: entrada com os produtos flutuando sobre um piso de tábuas; produto com raio-X,
   corrida até a porta (vitrine, frete pesado, montagem, impostos) e pódio de madeira.
   Claro = linho e carvalho. Escuro = nogueira à noite. Um acento só: telha. */
:root {
  --bg: #ebe3d5;            /* linho */
  --surface: #f6f1e8;
  --surface-2: #e2d7c5;
  --line: rgba(60,40,22,.12);
  --fg: #2b2018;            /* café */
  --muted: #7a6a5a;
  --accent: #c2502a;        /* telha */
  --accent-ink: #fff6ee;
  --accent-2: #e09068;      /* ICMS, telha clara */
  --sage: #74866a;          /* montagem */
  --wood: #a7774c;          /* frete */
  --seg-prod: #3a2d22;      /* vitrine */
  --ok: #3f8a5a;
  --plank-a: #d9c6a6; --plank-b: #cfb994; --plank-line: rgba(80,52,25,.16);
  --oak-1: #e6c48c; --oak-1d: #b48850; --oak-1t: #f3dcae;
  --oak-2: #c9a27a; --oak-2d: #8f6a45; --oak-2t: #dcbc96;
  --oak-3: #a8774f; --oak-3d: #6f4a2d; --oak-3t: #c0916a;
  --shadow: rgba(60,38,18,.28);
  --barra-bg: rgba(235,227,213,.94);
  --demo-bg: #2b2018; --demo-fg: #f3e6d6;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17110d; --surface: #211913; --surface-2: #2c221a; --line: rgba(255,232,205,.09);
  --fg: #f3e8da; --muted: #a8988a; --accent: #ef7446; --accent-ink: #1d0c04; --accent-2: #f3a983;
  --sage: #9db08f; --wood: #c39367; --seg-prod: #eadccb; --ok: #7fd09a;
  --plank-a: #2a1f17; --plank-b: #241a13; --plank-line: rgba(0,0,0,.35);
  --shadow: rgba(0,0,0,.55); --barra-bg: rgba(23,17,13,.94); --demo-bg: #2c1408; --demo-fg: #ffd9c2;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17110d; --surface: #211913; --surface-2: #2c221a; --line: rgba(255,232,205,.09);
  --fg: #f3e8da; --muted: #a8988a; --accent: #ef7446; --accent-ink: #1d0c04; --accent-2: #f3a983;
  --sage: #9db08f; --wood: #c39367; --seg-prod: #eadccb; --ok: #7fd09a;
  --plank-a: #2a1f17; --plank-b: #241a13; --plank-line: rgba(0,0,0,.35);
  --shadow: rgba(0,0,0,.55); --barra-bg: rgba(23,17,13,.94); --demo-bg: #2c1408; --demo-fg: #ffd9c2;
  color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); overflow-x: clip; padding-bottom: 46px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* barra */
.barra { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); z-index: 40; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
.barra.rolou { background: var(--barra-bg); border-bottom-color: var(--line); }
.barra .wrap { display: flex; align-items: center; gap: 10px; padding-block: 14px; }
.logo { font: 800 25px/1 var(--display); letter-spacing: -.01em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo em { font-style: normal; color: var(--accent); }
.logo small { font: 600 10.5px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; margin-left: 2px; align-self: center; }
.marca-svg { flex: none; }
.faixa-demo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--demo-bg); color: var(--demo-fg); font: 500 12.5px/1.35 var(--body); text-align: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.faixa-demo b { color: var(--accent-2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; margin-right: 6px; }
.demo-perto { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 6px; padding: 3px 7px; width: fit-content; margin-top: 6px; }
.barra .dir { margin-left: auto; display: flex; gap: 8px; }
.pilula { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; text-decoration: none; }
.pilula:hover { border-color: var(--muted); }
.pilula b { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 0 7px; font-size: 11px; }
.sino.toca svg { animation: sino .9s ease; transform-origin: 50% 10%; }
@keyframes sino { 15% { transform: rotate(18deg); } 35% { transform: rotate(-14deg); } 55% { transform: rotate(9deg); } 75% { transform: rotate(-5deg); } }

/* ================= ENTRADA ================= */
.palco { position: relative; height: 100svh; min-height: 660px; max-height: 980px; overflow: hidden; }
.parede { position: absolute; inset: 0 0 38%; background: radial-gradient(60% 80% at 68% 30%, color-mix(in srgb, var(--surface) 90%, transparent), transparent 70%); pointer-events: none; }
.janela { position: absolute; right: 7%; top: 9%; width: min(30vw, 380px); aspect-ratio: 3 / 4; border-radius: 200px 200px 6px 6px; background: linear-gradient(160deg, color-mix(in srgb, var(--accent-2) 22%, var(--surface)), var(--surface) 70%); opacity: .55; pointer-events: none; }
.janela::before, .janela::after { content: ""; position: absolute; background: var(--bg); opacity: .8; }
.janela::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
.janela::after { left: 0; right: 0; top: 52%; height: 6px; }
.piso { position: absolute; left: -20%; right: -20%; bottom: -14%; height: 52%; background: repeating-linear-gradient(90deg, var(--plank-a) 0 118px, var(--plank-line) 118px 120px, var(--plank-b) 120px 238px, var(--plank-line) 238px 240px); transform: perspective(700px) rotateX(58deg); transform-origin: top; mask-image: linear-gradient(transparent, #000 22%); pointer-events: none; }
.rodape-parede { position: absolute; left: 0; right: 0; bottom: 38%; height: 1px; background: var(--line); pointer-events: none; }
.palco::after { content: ""; position: absolute; inset: auto 0 0; height: 120px; background: linear-gradient(transparent, var(--bg)); pointer-events: none; z-index: 3; }
.nuvem { position: absolute; inset: 0; z-index: 1; }
.item { position: absolute; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.item .flutua { display: grid; justify-items: center; gap: 6px; position: relative; }
.item img { display: block; width: var(--w, 160px); height: auto; max-height: calc(var(--w, 160px) * 1.05); object-fit: contain; pointer-events: none; }
.item .sombra { width: calc(var(--w, 160px) * .8); height: calc(var(--w, 160px) * .12); margin-top: calc(var(--w, 160px) * -.07); border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), transparent); pointer-events: none; }
.item.longe { filter: saturate(.6); }
.item .etq { font: 500 11px/1.25 var(--mono); text-align: center; color: var(--muted); white-space: nowrap; opacity: 0; transform: translateY(-4px); transition: opacity .25s, transform .25s; background: var(--surface); border-radius: 8px; padding: 4px 8px; border: 1px solid var(--line); }
.item .etq b { display: block; color: var(--fg); font-weight: 600; font-size: 12px; }
.item:hover .etq, .item.frente .etq, .item:focus-visible .etq { opacity: 1; transform: none; }
.item.alvo-drop img { outline: 3px dashed var(--accent); outline-offset: 8px; border-radius: 12px; }
.item.arrastando { cursor: grabbing; z-index: 60 !important; }
.chamada { position: absolute; z-index: 4; left: max(20px, env(safe-area-inset-left, 0px)); bottom: 11%; width: min(560px, 46vw); display: grid; gap: 16px; pointer-events: none; }
.chamada > * { pointer-events: auto; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.chamada h1 { margin: 0; font: 800 clamp(52px, 6.6vw, 100px)/.9 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.chamada h1 .risco { color: var(--muted); background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 56% / 100% .08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; animation: risca .8s 1s cubic-bezier(.7,0,.2,1) backwards; }
@keyframes risca { from { background-size: 0% .08em; } }
.chamada p { margin: 0; font-size: 18px; max-width: 42ch; }
.campo-busca { position: relative; display: block; }
.campo-busca input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 17px 20px 17px 52px; font-size: 17px; outline: none; transition: border-color .2s, box-shadow .2s; box-shadow: 0 10px 30px -18px var(--shadow); }
.campo-busca input:focus { border-color: var(--accent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); }
.campo-busca svg { z-index: 1; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.comodos { display: flex; gap: 6px; flex-wrap: wrap; }
.comodos button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.comodos button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.comodos svg { width: 15px; height: 15px; }
.caso { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 10px 10px; width: fit-content; max-width: 100%; }
.caso:hover { border-color: var(--accent); }
.caso img { grid-row: 1 / 3; width: 54px; height: 44px; object-fit: contain; }
.caso small { font: 600 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.caso span { font-size: 14px; line-height: 1.3; }
.caso s { color: var(--muted); }
.dica { font: 12px var(--mono); color: var(--muted); }
.dica span { color: var(--fg); }
.irmao { font: 500 12px var(--mono); color: var(--muted); text-decoration: none; width: fit-content; border-bottom: 1px solid var(--line); }
.irmao:hover { color: var(--accent); border-color: var(--accent); }

/* ================= PRODUTO ================= */
.vista { padding-top: 84px; }
.voltar { font: 500 13px var(--mono); color: var(--muted); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.voltar:hover { color: var(--fg); }
.heroi { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(20px, 5vw, 80px); align-items: center; padding-block: 18px 60px; }
.cartao3d { position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; perspective: 900px; margin: 0; }
.cartao3d .luz { position: absolute; inset: 6%; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--glow, #d9b98f) 55%, transparent), transparent 72%); }
.cartao3d .arco { position: absolute; left: 14%; right: 14%; top: 4%; bottom: 14%; border-radius: 999px 999px 18px 18px; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 60%, transparent); }
.cartao3d .chao3d { position: absolute; left: 6%; right: 6%; bottom: 10%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), transparent); }
.cartao3d::before { content: attr(data-marca); position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); font: 800 clamp(100px, 15vw, 230px)/.8 var(--display); letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.5px var(--line); white-space: nowrap; pointer-events: none; }
.cartao3d .inclina { position: relative; width: 72%; transform-style: preserve-3d; will-change: transform; }
.cartao3d img { width: 100%; max-height: 500px; object-fit: contain; display: block; transform: translateZ(40px); }
.cartao3d figcaption { position: absolute; bottom: 1%; left: 0; right: 0; text-align: center; font: 10.5px var(--mono); color: var(--muted); }
.info { display: grid; gap: 16px; min-width: 0; }
.marca-prod { font: 600 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
.info h1 { margin: 0; font: 800 clamp(44px, 5.6vw, 86px)/.92 var(--display); letter-spacing: -.035em; text-wrap: balance; }
.fita { display: flex; flex-wrap: wrap; gap: 0; font: 500 12.5px var(--mono); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; width: fit-content; max-width: 100%; background: var(--surface); }
.fita span { padding: 6px 10px; border-right: 1px solid var(--line); }
.fita span:last-child { border-right: 0; }
.fita b { color: var(--muted); font-weight: 500; margin-right: 4px; }
.specs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.specs li { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; }
.final-box { display: grid; gap: 2px; }
.final-box small { color: var(--muted); font-size: 13px; }
.final-box strong { font: 800 clamp(54px, 6.4vw, 88px)/.95 var(--display); letter-spacing: -.03em; }
.final-box strong .rs { font-size: .4em; color: var(--muted); margin-right: .2em; vertical-align: .9em; }
.final-box .onde { color: var(--muted); }
.final-box .onde b { color: var(--fg); }
.economia { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.economia .val { font: 800 28px/1 var(--display); color: var(--accent); white-space: nowrap; }
.economia span { font-size: 13.5px; line-height: 1.35; }
.selo { display: inline-flex; align-items: center; gap: 8px; font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 8px; width: fit-content; }
.selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.selo.baixa { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.selo.alta { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.selo.normal { color: var(--muted); background: var(--surface-2); }
.acoes { display: flex; gap: 10px; flex-wrap: wrap; }
.bt { border: 0; border-radius: 14px; padding: 14px 20px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; transition: transform .15s, background .2s, border-color .2s; }
.bt:active { transform: scale(.97); }
.bt-acento { background: var(--accent); color: var(--accent-ink); }
.bt-acento:hover { background: color-mix(in srgb, var(--accent) 86%, var(--fg)); }
.bt-linha { background: transparent; border: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
.bt-linha:hover { border-color: var(--fg); }
.bt-p { padding: 9px 14px; font-size: 13px; border-radius: 10px; }

.secao { padding-block: 72px; border-top: 1px solid var(--line); position: relative; }
.secao-cab { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.secao-cab > div:first-child { min-width: 0; }
.secao-cab h2 { margin: 0; font: 800 clamp(36px, 4.4vw, 64px)/.95 var(--display); letter-spacing: -.03em; text-wrap: balance; }
.secao-cab p { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
.n-secao { font: 600 12px var(--mono); color: var(--accent); letter-spacing: .2em; display: block; margin-bottom: 10px; }

/* raio-x */
.raiox { position: relative; border-radius: 26px; overflow: hidden; height: 300px; background: var(--surface); border: 1px solid var(--line); touch-action: none; cursor: none; user-select: none; -webkit-user-select: none; }
.camada { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; }
.camada .rot { font: 600 12px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.vitrine .preco { font: 800 clamp(60px, 10vw, 140px)/.95 var(--display); letter-spacing: -.04em; }
.vitrine .preco small { font-size: .35em; color: var(--muted); vertical-align: .9em; margin-right: .15em; }
.raio { background: var(--accent); color: var(--accent-ink); clip-path: circle(var(--r, 90px) at var(--x, 30%) var(--y, 50%)); background-image: repeating-linear-gradient(90deg, transparent 0 22px, rgba(0,0,0,.07) 22px 23px); }
.raio .rot { color: inherit; opacity: .75; }
.raio .conta { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 4px 12px; font: 800 clamp(20px, 2.4vw, 32px)/1.05 var(--display); max-width: 1000px; }
.raio .conta i { font-style: normal; opacity: .6; font-weight: 500; }
.raio .conta .tot { font-size: 1.7em; display: block; width: 100%; margin-top: 8px; }
.lente { position: absolute; width: calc(var(--r, 90px) * 2); height: calc(var(--r, 90px) * 2); left: var(--x, 30%); top: var(--y, 50%); transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--fg); box-shadow: 0 0 0 6px color-mix(in srgb, var(--fg) 8%, transparent), 0 20px 50px var(--shadow); pointer-events: none; }
.lente::after { content: "arraste"; position: absolute; left: 50%; bottom: -30px; transform: translateX(-50%); font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--bg); background: var(--fg); padding: 3px 8px; border-radius: 6px; }

/* sua entrega: as escolhas que mudam a corrida */
.entrega { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; margin-bottom: 14px; }
.entrega .rot { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.grupo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 3px var(--shadow); }

/* corrida */
.placa-fase { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fase { font: 700 19px var(--display); letter-spacing: -.01em; padding: 8px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 260px; }
.fase b { color: var(--accent); }
.etapas { display: flex; gap: 6px; }
.etapas i { width: 30px; height: 6px; border-radius: 99px; background: var(--surface-2); transition: background .3s; }
.etapas i.on { background: var(--accent); }
.pista { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px; overflow: hidden; }
.pista::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 79px, var(--line) 79px 80px); opacity: .5; pointer-events: none; }
.raias { position: relative; }
.raia { position: absolute; left: 0; right: 0; height: 60px; display: grid; grid-template-columns: 46px 170px minmax(0, 1fr) 128px; gap: 12px; align-items: center; border-bottom: 1px dashed var(--line); }
.raia .pos { font: 800 28px/1 var(--display); color: var(--muted); text-align: center; }
.raia.p1 .pos { color: var(--oak-1d); } .raia.p2 .pos { color: var(--oak-2d); } .raia.p3 .pos { color: var(--oak-3d); }
.raia .nome { font-weight: 600; line-height: 1.15; min-width: 0; }

    let dica = calmo ? null : gsap.to(pos, { x: 70, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 1, delay: .6, onUpdate: aplicar });
    const mv = e => { const b = box.getBoundingClientRect(); pos.x = Math.max(0, Math.min(100, (e.clientX - b.left) / b.width * 100)); pos.y = Math.max(0, Math.min(100, (e.clientY - b.top) / b.height * 100)); aplicar(); };
    box.addEventListener("pointerdown", e => { dica && dica.kill(); dica = null; box.setPointerCapture(e.pointerId); mv(e); bip(300, .08, "sawtooth", .02); });
    box.addEventListener("pointermove", e => { if (fino || e.buttons) { dica && dica.kill(); dica = null; mv(e); } });
  }

  // ---------- a corrida ----------
  function montarCorrida(p, r) {
    const raias = [...document.querySelectorAll(".raia")], lista = r.lista;
    const alt = () => estreito() ? 72 : 60;
    const fases = [
      { nome: "Largada: <b>preço da vitrine</b>", v: o => o.preco, seg: o => [o.preco, 0, 0, 0, 0] },
      { nome: "+ <b>frete</b>", v: o => o.preco + o.frete, seg: o => [o.preco, o.frete, 0, 0, 0] },
      { nome: "+ <b>montagem</b>", v: o => o.preco + o.frete + o.montagem, seg: o => [o.preco, o.frete, o.montagem, 0, 0] },
      { nome: "+ <b>imposto e ICMS</b>", v: o => o.total, seg: o => [o.preco, o.frete, o.montagem, o.ii, o.icms] }
    ];
    const maxV = Math.max(...lista.map(o => o.total)) * 1.04;
    let tl = null, rodando = false;
    // quem atrasa vai sempre para o fim, desde a largada
    const ranking = f => lista.map((o, i) => i).sort((a, b) => (lista[a].atrasa - lista[b].atrasa) || fases[f].v(lista[a]) - fases[f].v(lista[b]) || a - b);
    const marcar = (el, o, pos) => { el.className = "raia" + (o.atrasa ? " tarde" : pos < 3 ? " p" + (pos + 1) : ""); el.querySelector(".pos").textContent = o.atrasa ? "tarde" : pos + 1; };
    // antes da largada: cada loja na sua raia, na ordem da vitrine
    ranking(0).forEach((idx, pos) => { raias[idx].style.top = pos * alt() + "px"; if (lista[idx].atrasa) raias[idx].classList.add("tarde"); });
    if (!calmo) gsap.set(".coluna", { opacity: 0 }); else estadoFinal();

    function estadoFinal() {
      ranking(3).forEach((idx, pos) => { const el = raias[idx], o = lista[idx]; el.style.top = pos * alt() + "px"; marcar(el, o, pos); el.querySelector(".val").textContent = brl(o.total); fases[3].seg(o).forEach((s, k) => el.querySelectorAll(".barra-c i")[k].style.width = s / maxV * 100 + "%"); el.querySelector(".ficha").style.left = o.total / maxV * 100 + "%"; });
      document.querySelectorAll("#etapas i").forEach(i => i.classList.add("on"));
      document.getElementById("fase").innerHTML = "Chegada: <b>preço na porta</b>";
    }

    function largar() {
      if (rodando) return; rodando = true;
      document.getElementById("largar").textContent = "Ver de novo";
      gsap.set(".coluna", { opacity: 0 });
      if (calmo) { estadoFinal(); mostrarPodio(); rodando = false; return; }
      tl && tl.kill();
      const posInicial = ranking(0);
      raias.forEach((el, i) => { el.style.top = posInicial.indexOf(i) * alt() + "px"; el.className = "raia" + (lista[i].atrasa ? " tarde" : ""); el.querySelector(".pos").textContent = "–"; el.querySelector(".val").textContent = "R$ 0"; el.querySelectorAll(".barra-c i").forEach(b => b.style.width = "0%"); el.querySelector(".ficha").style.left = "0%"; el.querySelector(".queda").style.opacity = 0; });
      document.querySelectorAll("#etapas i").forEach(i => i.classList.remove("on"));
      tl = gsap.timeline({ onComplete: () => { rodando = false; document.getElementById("fase").innerHTML = "Chegada: <b>preço na porta</b>"; mostrarPodio(); } });
      fases.forEach((f, fi) => {
        tl.call(() => { document.getElementById("fase").innerHTML = f.nome; document.querySelectorAll("#etapas i")[fi].classList.add("on"); bip(400 + fi * 140, .14, "square", .03); }, null, fi === 0 ? 0 : "+=.35");
        const inicio = tl.duration(), dur = fi === 0 ? 1.3 : .9, ease = fi === 0 ? "power3.out" : "power2.inOut";
        lista.forEach((o, i) => {
          const el = raias[i], segs = f.seg(o), barras = el.querySelectorAll(".barra-c i"), atraso = fi === 0 ? i * .05 : 0;
          segs.forEach((s, k) => tl.to(barras[k], { width: s / maxV * 100 + "%", duration: dur, ease }, inicio + atraso));
          tl.to(el.querySelector(".ficha"), { left: f.v(o) / maxV * 100 + "%", duration: dur, ease }, inicio + atraso);
          const val = el.querySelector(".val"), obj = { v: fi === 0 ? 0 : fases[fi - 1].v(o) };
          tl.to(obj, { v: f.v(o), duration: dur, ease: "power2.out", onUpdate: () => val.textContent = brl(obj.v) }, inicio);
        });
        ranking(fi).forEach((idx, pos) => {
          const el = raias[idx], quando = inicio + (fi === 0 ? 1.1 : .95);
          tl.to(el, { top: pos * alt(), duration: .7, ease: "power3.inOut" }, quando);
          tl.call(() => {
            marcar(el, lista[idx], pos);
            const perdeu = pos - posInicial.indexOf(idx), q = el.querySelector(".queda");
            if (fi > 0 && perdeu > 0 && !lista[idx].atrasa) { q.textContent = `▼ caiu ${perdeu}`; gsap.to(q, { opacity: 1, duration: .3 }); } else if (fi > 0) gsap.to(q, { opacity: 0, duration: .3 });
          }, null, quando);
        });
      });
    }

    function mostrarPodio() {
      const cols = document.querySelectorAll(".coluna");
      gsap.set(cols, { opacity: 1 });
      if (calmo) return;
      const ordem = [...cols].sort((a, b) => b.dataset.k - a.dataset.k);
      const t = gsap.timeline();
      ordem.forEach((c, i) => {
        t.from(c.querySelector(".cubo"), { scaleY: 0, duration: .8, ease: "back.out(1.6)" }, i * .35)
         .from(c.querySelector(".topo-info"), { y: 30, opacity: 0, duration: .5, ease: "power3.out" }, i * .35 + .4)
         .call(() => bip([523, 659, 784][i], .25, "triangle"), null, i * .35 + .2);
      });
      if (cols.length) t.call(confete, null, 1.3);
    }
    return { largar };
  }

  // confete leve: lascas de madeira e telha (110 pedaços, some em 3 s)
  function confete() {
    const cv = document.getElementById("confete"); if (!cv || calmo) return;
    const b = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = b.width * dpr; cv.height = b.height * dpr;
    const g = cv.getContext("2d"); g.scale(dpr, dpr);
    const cores = [cor("--accent"), cor("--oak-1"), cor("--sage"), cor("--accent-2")];
    const ps = Array.from({ length: 110 }, () => ({ x: b.width / 2 + (Math.random() - .5) * 60, y: b.height * .45, vx: (Math.random() - .5) * 9, vy: -Math.random() * 11 - 4, r: Math.random() * 6 + 3, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cores[Math.random() * 4 | 0] }));
    const t0 = performance.now(); bip(1046, .4, "triangle");
    (function anima(t) {
      const dt = t - t0; g.clearRect(0, 0, b.width, b.height);
      ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.globalAlpha = Math.max(0, 1 - dt / 3000); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
      if (dt < 3000) requestAnimationFrame(anima); else g.clearRect(0, 0, b.width, b.height);
    })(t0);
  }

  // ---------- linha do tempo com preço-alvo arrastável ----------
  function grafico(p, r) {
    const m = r.melhor, alerta = alertas.de(p.id);
    const pontos = m.historico.map(h => ({ data: h.data, v: N.contaPara(m, h.preco).total }));
    pontos[pontos.length - 1].v = m.total;
    const n = pontos.length, vals = pontos.map(x => x.v);
    let min = Math.min(...vals), max = Math.max(...vals);
    const pad = (max - min) * .25 || max * .08; min = Math.max(0, min - pad); max = max + pad * .5;
    const W = estreito() ? 520 : 1100, H = 300, pl = 66, pr = 22, pt = 24, pb = 30;
    const x = i => pl + i / (n - 1) * (W - pl - pr), y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb), yInv = py => min + (1 - (py - pt) / (H - pt - pb)) * (max - min);
    const caminho = pontos.map((q, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(q.v).toFixed(1)}`).join("");
    let mi = 0; pontos.forEach((q, i) => { if (q.v < pontos[mi].v) mi = i; });
    let eixo = "", ult = -1; pontos.forEach((q, i) => { const k = +q.data.slice(5, 7) - 1; if (k !== ult && i) eixo += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${meses[k]}</text>`; ult = k; });
    const ticks = [0, .5, 1].map(t => { const v = min + pad * .6 + t * (max - min - pad); return `<line class="grade" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 10}" y="${y(v) + 4}" text-anchor="end">${brlCurto(v)}</text>`; }).join("");
    const passo = max > 2000 ? 10 : 1;
    let alvo = alerta ? alerta.alvo : Math.round(m.total * .9 / passo) * passo;
    document.getElementById("grafico").innerHTML = `<svg class="grafico" id="svg-g" viewBox="0 0 ${W} ${H}" role="img" aria-label="Preço final nos últimos 6 meses">
      <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${ticks}${eixo}
      <path d="${caminho}L${x(n - 1)},${H - pb}L${x(0)},${H - pb}Z" fill="url(#ga)" id="g-area"/>
      <path d="${caminho}" class="linha" id="g-linha"/>
      <circle cx="${x(mi)}" cy="${y(pontos[mi].v)}" r="6" fill="var(--ok)" class="pulsa"/><circle cx="${x(mi)}" cy="${y(pontos[mi].v)}" r="5" fill="var(--ok)"/>
      <text class="ok-t" x="${Math.min(Math.max(x(mi), pl + 90), W - pr - 90)}" y="${Math.min(y(pontos[mi].v) + 24, H - pb - 6)}" text-anchor="middle">melhor momento · ${brl(pontos[mi].v)}</text>
      <circle cx="${x(n - 1)}" cy="${y(m.total)}" r="6" fill="var(--surface)" stroke="var(--fg)" stroke-width="2"/>
      <g id="g-alvo"><line class="alvo-l" x1="${pl}" x2="${W - pr}" y1="0" y2="0"/><rect x="${pl}" y="-14" width="${W - pl - pr}" height="28" fill="transparent" class="puxador"/><g class="puxador"><rect x="${W - pr - 112}" y="-14" width="112" height="28" rx="14" fill="var(--accent)"/><text x="${W - pr - 56}" y="5" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600" id="g-alvo-t"></text></g></g>
    </svg>`;
    const range = document.getElementById("alvo-range");
    range.min = Math.ceil(min / passo) * passo; range.max = Math.floor(max / passo) * passo; range.step = passo;
    function aplicar(v) {
      alvo = Math.max(+range.min, Math.min(+range.max, Math.round(v / passo) * passo));
      document.getElementById("g-alvo").setAttribute("transform", `translate(0 ${y(alvo)})`);
      document.getElementById("g-alvo-t").textContent = brlCurto(alvo);
      document.getElementById("alvo-v").textContent = brl(alvo); range.value = alvo;
    }
    aplicar(alvo);
    range.oninput = () => aplicar(+range.value);
    const svg = document.getElementById("svg-g"); let pegando = false;
    const py = e => { const b = svg.getBoundingClientRect(); return (e.clientY - b.top) * (H / b.height); };
    svg.addEventListener("pointerdown", e => { if (!e.target.closest(".puxador")) return; pegando = true; svg.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", e => { if (pegando) aplicar(yInv(py(e))); });
    svg.addEventListener("pointerup", () => pegando = false);
    const linha = document.getElementById("g-linha"), L = linha.getTotalLength();
    if (!calmo) {
      linha.style.strokeDasharray = L; linha.style.strokeDashoffset = L;
      const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { gsap.to(linha, { strokeDashoffset: 0, duration: 2, ease: "power2.inOut" }); gsap.from("#g-area", { opacity: 0, duration: 1.4, delay: .8 }); io.disconnect(); } }, { threshold: .3 });
      io.observe(svg); naSaida(() => io.disconnect());
    }
    document.getElementById("salvar-alerta").onclick = () => { alertas.salvar(p.id, alvo); tocarSino(); aviso("Alerta criado", `Avisamos aqui quando o preço final chegar a ${brl(alvo)}.`); contador(); };
    const rem = document.getElementById("remover-alerta"); if (rem) rem.onclick = () => { alertas.remover(p.id); aviso("Alerta removido"); render(); };
  }

  // =============================================================
  // COMPARAR (arrastou um produto sobre o outro)
  // =============================================================
  function telaComparar(a, b) {
    const ra = resumo(a), rb = resumo(b), ganha = ra.melhor.total <= rb.melhor.total ? a : b, perde = ganha === a ? b : a;
    const dif = Math.abs(ra.melhor.total - rb.melhor.total);
    document.documentElement.style.setProperty("--glow", ganha.cor);
    const lado = (p, r) => `<div class="lado ${p === ganha ? "ganha" : ""}"><img src="${p.recorte}" alt="">
      <span class="marca-prod">${esc(p.marca || p.categoria)}</span><h3>${esc(p.nome)}</h3><span class="p num">${brlCurto(r.melhor.total)}</span>
      <span class="m">menor final na ${esc(loja(r.melhor.loja).nome)} · ${r.melhor.prazoDias} dias · ${r.lista.length} lojas</span><span class="selo ${r.selo.tipo}">${r.selo.texto}</span>
      <a class="bt bt-linha bt-p" href="#${p.id}">Ver a corrida</a></div>`;
    $app.innerHTML = `<div class="vista"><div class="wrap"><a class="voltar" href="#inicio">← todos os produtos</a>
      <div class="secao-cab" style="margin-top:18px"><div><span class="n-secao">FRENTE A FRENTE</span><h2>Lado a lado</h2></div></div>
      <div class="duelo">${lado(a, ra)}<span class="vs">VS</span>${lado(b, rb)}</div>
      <p class="veredito">${esc(nomeCompleto(ganha))} sai <b>${brl(dif)}</b> mais barato que ${esc(nomeCompleto(perde))}, já com frete, montagem e impostos.</p>
      </div><footer class="wrap rodape" style="margin-top:60px"><span>Protótipo de estudo. Preços de demonstração.</span></footer></div>`;
    if (!calmo) { gsap.from(".lado", { y: 50, opacity: 0, duration: .9, ease: "expo.out", stagger: .12 }); gsap.from(".vs", { scale: 0, rotation: -20, duration: .7, ease: "back.out(2)", delay: .3 }); }
  }

  // =============================================================
  // NAVEGAÇÃO
  // =============================================================
  function render() {
    limpar.forEach(f => f()); limpar = [];
    gsap.killTweensOf("*");
    const h = location.hash.slice(1);
    const cmp = h.match(/^comparar-(.+)--(.+)$/);
    if (cmp && produto(cmp[1]) && produto(cmp[2])) telaComparar(produto(cmp[1]), produto(cmp[2]));
    else if (produto(h)) telaProduto(produto(h));
    else telaInicio();
    verificar();
  }
  const barra = document.querySelector(".barra");
  addEventListener("scroll", () => barra.classList.toggle("rolou", scrollY > 40), { passive: true });
  let ultimo = location.hash;
  addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (h === "corrida" || h === "historico") { history.replaceState(null, "", ultimo || "#"); document.getElementById(h)?.scrollIntoView({ behavior: calmo ? "auto" : "smooth" }); return; }
    ultimo = location.hash; scrollTo(0, 0); render();
    if (!calmo) gsap.fromTo($app, { y: 24 }, { y: 0, duration: .6, ease: "expo.out" });
  });
  render();
})();
</script>
